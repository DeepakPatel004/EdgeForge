
services:
  origin:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./origin/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./origin/content:/usr/share/nginx/html:ro
    networks:
      - cdn-network

  edge-1:
    image: nginx:stable
    hostname: edge-1
    restart: unless-stopped
    depends_on:
      - origin
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cdn-network

  edge-2:
    image: nginx:stable
    hostname: edge-2
    restart: unless-stopped
    depends_on:
      - origin
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cdn-network

  edge-3:
    image: nginx:stable
    hostname: edge-3
    restart: unless-stopped
    depends_on:
      - origin
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cdn-network

  load-balancer:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - edge-1
      - edge-2
      - edge-3
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cdn-network

networks:
  cdn-network:
    driver: bridge
