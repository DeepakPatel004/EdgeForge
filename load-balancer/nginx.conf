events {}

http {
    upstream edge_servers {
        server edge-1:80;
        server edge-2:80;
        server edge-3:80;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://edge_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}